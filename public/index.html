<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AMI-MEET</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg">
    <div class="blob blob--a"></div>
    <div class="blob blob--b"></div>
    <div class="blob blob--c"></div>
    <div class="noise"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <div class="brand__mark">MM</div>
      <div class="brand__text">
        <div class="brand__name">AMI-MEET</div>
        <div class="brand__sub">• ultra light</div>
      </div>
    </div>

    <div class="roombar">
      <div class="chip">
        <span class="chip__label">Room</span>
        <input id="roomInput" class="roombar__input" placeholder="ej: demo" />
      </div>

      <button id="joinBtn" class="btn btn--primary"><span class="btn__icon">↪</span>Entrar</button>
      <button id="copyBtn" class="btn btn--ghost"><span class="btn__icon">🔗</span>Copiar link</button>
    </div>
  </header>

  <main class="app">
    <section class="stage">
      <div class="stage__header">
        <div class="title">
          <h1 class="title__h">Tu sala</h1>
          <p class="title__p">En móvil: usa “Presentar” (cámara trasera). En laptop: Pantalla + audio si el navegador lo permite.</p>
        </div>

        <div class="statusPill">
          <span class="dot"></span>
          <span id="status" class="statusPill__text">Listo</span>
        </div>
      </div>

      <div class="tile tile--local">
        <div class="tile__top">
          <div class="badge badge--local">Tú</div>
          <div class="tile__meta"><span class="meta meta--hint">Preview</span></div>
        </div>

        <video id="localVideo" class="tile__video" autoplay playsinline muted></video>

        <div class="dock" role="group" aria-label="Controles">
          <button id="camBtn" class="dock__btn" title="Iniciar cámara">
            <span class="dock__i">📷</span><span class="dock__t">Frontal</span>
          </button>

          <button id="presentBtn" class="dock__btn" title="Presentar (cámara trasera)">
            <span class="dock__i">📷</span><span class="dock__t">Trasera</span>
          </button>

          <button id="muteBtn" class="dock__btn dock__btn--ghost" title="Mute / Unmute">
            <span class="dock__i">🔇</span><span class="dock__t">Mute</span>
          </button>
          
          <button id="screenBtn" class="dock__btn" title="Compartir pantalla + audio (desktop)">
            <span class="dock__i">🖥️</span><span class="dock__t">Pantalla</span>
          </button>


          <!-- <button id="stopBtn" class="dock__btn dock__btn--danger" title="Detener todo">
            <span class="dock__i">⛔</span><span class="dock__t">Detener</span>
          </button> -->
        </div>

        <div class="tile__bottom">
          <div class="note">
            <span class="note__i">💡</span>
            <span class="note__t">Para escuchar audio remoto, toca “Escuchar” en cada tile remoto.</span>
          </div>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="sidebar__header">
        <h2 class="sidebar__h">Participantes</h2>
        <p class="sidebar__p">Dale “Escuchar” a un tile remoto para habilitar audio.</p>
      </div>

      <div id="remotes" class="remoteGrid"></div>
    </aside>
  </main>

  <script src="app.js?v=999"></script>
</body>
</html>
